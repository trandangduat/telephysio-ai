services:
  expo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telephysio-ai-mobile-expo
    working_dir: /app
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - .:/app
      - expo_node_modules:/app/node_modules
    stdin_open: true
    tty: true
    # Use --lan instead of --tunnel to avoid Ngrok dependency.
    # Tunnel mode: docker compose run --rm expo npm run docker:start
    command: npx expo start --lan --web

volumes:
  expo_node_modules:
