<body class="bg-inverse-surface antialiased h-screen w-full overflow-hidden flex flex-col font-body-md text-body-md">
<!-- Main Viewfinder / Canvas Area -->
<main class="relative flex-1 w-full bg-inverse-surface flex flex-col items-center justify-center overflow-hidden">
<!-- Camera Feed Placeholder & Skeleton Overlay -->
<div class="absolute inset-0 w-full h-full bg-inverse-surface flex items-center justify-center">
<img alt="Person doing a squat in a dark room" class="w-full h-full object-cover opacity-60 mix-blend-luminosity" data-alt="athlete performing a squat in a dim gym, high contrast, dark background, cinematic lighting, overlaid with vivid neon green computer vision tracking lines and joint nodes indicating posture analysis" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBIeIF0cSCStyLXhD8_segJ7cQLtIFLWwl87R9k7iALIsZfDrMNbHWTk5it6Rlvcq_oD5zUUmqcFPIWb_PwEWZyXhEHXvE_6POMZ4RnRSPpyxaXBon0RGdRo2BMjr47UgMsjDUI7dL-hT_c0W2uzI6lPahPwNgI1bxFrF8aAOJdzXVqaPo-3Tu9Qxpk0S12ommhnZcyHc6aoWDrioAsYffC4dum8zZCCsvQkPycPWeuAdX6nQKROCX2A_Qiqw_33WOOayLqsVj36E2T"/>
<!-- Simulated Skeleton UI Layer (CSS Shapes) -->
<div class="absolute inset-0 w-full h-full pointer-events-none flex items-center justify-center opacity-80">
<svg class="absolute stroke-tertiary-fixed-dim fill-transparent" height="100%" preserveaspectratio="xMidYMid slice" viewbox="0 0 300 500" width="100%">
<!-- Head -->
<circle cx="150" cy="120" r="15" stroke-width="3"></circle>
<!-- Spine -->
<line stroke-width="4" x1="150" x2="150" y1="135" y2="250"></line>
<!-- Shoulders -->
<line stroke-width="4" x1="100" x2="200" y1="160" y2="160"></line>
<!-- Left Arm -->
<line stroke-width="3" x1="100" x2="80" y1="160" y2="230"></line>
<line stroke-width="3" x1="80" x2="90" y1="230" y2="290"></line>
<!-- Right Arm -->
<line stroke-width="3" x1="200" x2="220" y1="160" y2="230"></line>
<line stroke-width="3" x1="220" x2="210" y1="230" y2="290"></line>
<!-- Hips -->
<line stroke-width="4" x1="120" x2="180" y1="250" y2="250"></line>
<!-- Left Leg (Squat Position) -->
<line stroke-width="4" x1="120" x2="100" y1="250" y2="330"></line>
<line stroke-width="4" x1="100" x2="130" y1="330" y2="420"></line>
<!-- Right Leg (Squat Position) -->
<line stroke-width="4" x1="180" x2="200" y1="250" y2="330"></line>
<line stroke-width="4" x1="200" x2="170" y1="330" y2="420"></line>
<!-- Nodes -->
<circle class="fill-tertiary-fixed-dim" cx="100" cy="160" r="4"></circle>
<circle class="fill-tertiary-fixed-dim" cx="200" cy="160" r="4"></circle>
<circle class="fill-tertiary-fixed-dim" cx="80" cy="230" r="4"></circle>
<circle class="fill-tertiary-fixed-dim" cx="220" cy="230" r="4"></circle>
<circle class="fill-tertiary-fixed-dim" cx="120" cy="250" r="4"></circle>
<circle class="fill-tertiary-fixed-dim" cx="180" cy="250" r="4"></circle>
<circle class="fill-tertiary-fixed-dim" cx="100" cy="330" r="4"></circle>
<circle class="fill-tertiary-fixed-dim" cx="200" cy="330" r="4"></circle>
<circle class="fill-tertiary-fixed-dim" cx="130" cy="420" r="4"></circle>
<circle class="fill-tertiary-fixed-dim" cx="170" cy="420" r="4"></circle>
</svg>
</div>
</div>
<!-- Top Contextual HUD (Not standard TopAppBar as per mandate for focused flows) -->
<header class="absolute top-0 left-0 w-full p-md pt-8 flex justify-between items-start z-20">
<button class="w-10 h-10 rounded-full bg-inverse-surface/50 backdrop-blur border border-outline-variant/30 flex items-center justify-center text-on-secondary hover:bg-inverse-surface/80 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<div class="flex flex-col items-center">
<div class="px-sm py-xs rounded-full bg-error/20 border border-error/50 backdrop-blur flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-error animate-pulse"></div>
<span class="font-label-md text-label-md text-on-secondary tracking-widest uppercase">Live</span>
</div>
<span class="font-body-lg text-body-lg text-on-secondary mt-2 tabular-nums opacity-80">14:22</span>
</div>
<button class="w-10 h-10 rounded-full bg-inverse-surface/50 backdrop-blur border border-outline-variant/30 flex items-center justify-center text-on-secondary hover:bg-inverse-surface/80 transition-colors">
<span class="material-symbols-outlined">cameraswitch</span>
</button>
</header>
<!-- Real-time AI Feedback Badge -->
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 z-20">
<div class="px-md py-sm rounded-full bg-surface/10 backdrop-blur-md border border-tertiary-fixed-dim/30 shadow-[0_4px_12px_rgba(105,222,124,0.15)] flex items-center gap-2">
<span class="material-symbols-outlined text-tertiary-fixed-dim text-lg">check_circle</span>
<span class="font-label-md text-label-md text-on-secondary">Excellent Depth</span>
</div>
</div>
</main>
<!-- Bottom Dashboard Panel -->
<section class="relative z-30 bg-surface w-full rounded-t-xl sm:rounded-t-3xl shadow-[0_-8px_24px_rgba(0,27,61,0.15)] flex flex-col gap-lg px-md sm:px-lg py-xl pb-safe border-t border-outline-variant/20">
<!-- Header Info -->
<div class="flex justify-between items-end">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-1">Current Set</span>
<h1 class="font-headline-xl text-headline-xl text-on-surface">Squat</h1>
</div>
<div class="flex flex-col items-end">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-1">Reps</span>
<div class="flex items-baseline gap-1">
<span class="font-headline-xl text-headline-xl text-primary">8</span>
<span class="font-headline-md text-headline-md text-outline">/12</span>
</div>
</div>
</div>
<!-- AI Progress Bar -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center px-1">
<span class="font-label-md text-label-md text-outline">Form Accuracy</span>
<span class="font-label-md text-label-md text-tertiary-container">92%</span>
</div>
<div class="w-full h-3 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full w-[92%] rounded-full bg-gradient-to-r from-primary to-tertiary-fixed-dim transition-all duration-300 ease-out"></div>
</div>
</div>
<!-- Media Controls -->
<div class="flex justify-center items-center gap-6 pt-sm">
<button class="w-12 h-12 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center hover:bg-surface-dim transition-colors">
<span class="material-symbols-outlined">skip_previous</span>
</button>
<button class="w-20 h-20 rounded-full bg-primary text-on-primary shadow-[0_4px_16px_rgba(0,71,141,0.3)] flex items-center justify-center hover:scale-105 active:scale-95 transition-all">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="w-12 h-12 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center hover:bg-surface-dim transition-colors">
<span class="material-symbols-outlined">skip_next</span>
</button>
</div>
</section>
</body></html>
