name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Expo app
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: telephysio-ai-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: telephysio-ai-mobile/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run Expo doctor
        run: npx expo-doctor

      - name: Run TypeScript check
        run: npx tsc --noEmit
